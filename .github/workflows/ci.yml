# CI for the private source repo (s00d/onlinesim-mcp), run here because public-repo Actions are free.
# The source is checked out with a read-only deploy key (secret SRC_DEPLOY_KEY); it is never committed here.
# Manual only: fork PRs cannot reach the secret, and nothing else triggers it.
name: ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of s00d/onlinesim-mcp"
        required: true
        default: master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s00d/onlinesim-mcp
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          cache-on-failure: "true"

      - name: Install GTK (tray-icon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features dev -- -D warnings
      - run: cargo test --locked
      - run: cargo test --features dev --locked
      - run: cargo run --features dev -- doctor
      - run: cargo run --features dev -- mcp --help
